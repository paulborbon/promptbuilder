<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Issue · Beta 2.0</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><main class="container py-4"><div class="brand-section mb-4"><h1 class="h2">Report an Issue to the Creator</h1><p class="mb-0">Found a bug, display problem, save issue, AI problem, or email problem? Send the details for review.</p></div><div class="card rounded-4"><div class="card-body p-4"><form id="supportForm" enctype="multipart/form-data"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="fullName">Full Name</label><input id="fullName" name="fullName" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="email">Email Address</label><input id="email" name="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="pageFeature">Page / Feature</label><input id="pageFeature" name="pageFeature" class="form-control"></div><div class="col-md-6"><label class="form-label" for="issueType">Issue Type</label><select id="issueType" name="issueType" class="form-select"><option>Bug</option><option>Display Issue</option><option>Save Problem</option><option>AI Problem</option><option>Email Problem</option><option>Other</option></select></div><div class="col-12"><label class="form-label" for="issueDescription">Description</label><textarea id="issueDescription" name="issueDescription" class="form-control" rows="6" required placeholder="What happened? What did you expect to happen?"></textarea></div><div class="col-12"><label class="form-label" for="screenshots">Screenshots / Images</label><input id="screenshots" name="screenshots" type="file" class="form-control" accept="image/png,image/jpeg,image/webp" multiple><div class="field-meta">PNG, JPG, JPEG, or WEBP. Up to 5 images; recommended maximum 5 MB each.</div></div></div><div class="pb-form-actions"><div class="form-actions"><button class="btn pb-button" type="submit">Submit Issue</button><button class="btn pb-button pb-cancel" type="button" onclick="PBCancelToPrevious()">Cancel</button></div><span id="supportStatus" class="small-note"></span></div></form></div></div></main><script src="../javascript/config.js"></script><script src="../javascript/site-services.js"></script><script src="../javascript/app.js"></script><script>const params=new URLSearchParams(location.search);pageFeature.value=params.get('page')||document.referrer||'';supportForm.addEventListener('submit',async e=>{e.preventDefault();const files=[...screenshots.files];if(files.length>5){supportStatus.textContent='Please attach no more than 5 screenshots.';return;}if(files.some(f=>f.size>5*1024*1024)){supportStatus.textContent='Each screenshot must be 5 MB or smaller.';return;}supportStatus.textContent='Sending…';try{const fd=new FormData(supportForm);fd.append('subject','Tech Support');fd.append('browser',navigator.userAgent);fd.append('screenSize',screen.width+'x'+screen.height);fd.append('version','Beta 2.0');fd.append('submittedAt',new Date().toISOString());await PBSiteServices.sendForm('support',fd);supportStatus.textContent='Issue submitted successfully.';supportForm.reset();}catch(err){supportStatus.textContent=err.message;}});</script></body></html>
