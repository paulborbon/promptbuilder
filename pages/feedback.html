<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback · Beta 2.0</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head><body><main class="container py-4"><div class="brand-section mb-4"><h1 class="h2">Feedback</h1><p class="mb-0">Your feedback helps improve Prompt Builder and the surrounding site experience.</p></div><div class="card rounded-4"><div class="card-body p-4"><form id="feedbackForm"><label class="form-label d-block" for="rating">Rating</label><input id="rating" name="rating" type="hidden" required><div class="star-rating mb-3" role="radiogroup" aria-label="Rating"><button type="button" data-rating="1" aria-label="1 star">★</button><button type="button" data-rating="2" aria-label="2 stars">★</button><button type="button" data-rating="3" aria-label="3 stars">★</button><button type="button" data-rating="4" aria-label="4 stars">★</button><button type="button" data-rating="5" aria-label="5 stars">★</button><span id="ratingLabel" class="small-note"></span></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="featureUsed">Feature Used</label><input id="featureUsed" name="featureUsed" class="form-control"></div><div class="col-md-6"><label class="form-label" for="fullName">Name <span class="small-note">(optional)</span></label><input id="fullName" name="fullName" class="form-control"></div><div class="col-12"><label class="form-label" for="feedbackComments">Comments</label><textarea id="feedbackComments" name="comments" class="form-control" rows="5" required></textarea></div><div class="col-md-6"><label class="form-label" for="displayName">If approved as a testimonial, display me as</label><select id="displayName" name="displayName" class="form-select"><option>Full name</option><option>First name + last initial</option><option>Anonymous</option></select></div></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="testimonialConsent" name="testimonialConsent"><label class="form-check-label" for="testimonialConsent">I give permission for this feedback to appear publicly as a testimonial after review.</label></div><p class="small-note mt-3">Feedback is never published automatically. Testimonial submissions remain pending until the site owner approves or rejects them.</p><div class="pb-form-actions"><div class="form-actions"><button class="btn pb-button" type="submit">Send Feedback</button><button class="btn pb-button pb-cancel" type="button" onclick="PBCancelToPrevious()">Cancel</button></div><span id="feedbackStatus" class="small-note"></span></div></form></div></div></main><script src="../javascript/config.js"></script><script src="../javascript/site-services.js"></script><script src="../javascript/app.js"></script><script>const labels={1:'Poor',2:'Fair',3:'Good',4:'Very Good',5:'Excellent'};document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{rating.value=b.dataset.rating;ratingLabel.textContent=b.dataset.rating+' / 5 · '+labels[b.dataset.rating];document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('selected',Number(x.dataset.rating)<=Number(b.dataset.rating)));});featureUsed.value=new URLSearchParams(location.search).get('page')||'';feedbackForm.addEventListener('submit',async e=>{e.preventDefault();if(!rating.value){feedbackStatus.textContent='Please choose a star rating.';return;}feedbackStatus.textContent='Sending…';try{await PBSiteServices.sendJSON('feedback',{rating:Number(rating.value),featureUsed:featureUsed.value,fullName:fullName.value,comments:feedbackComments.value,displayName:displayName.value,testimonialConsent:testimonialConsent.checked,submittedAt:new Date().toISOString()});feedbackStatus.textContent='Thank you. Your feedback was submitted.';feedbackForm.reset();rating.value='';ratingLabel.textContent='';document.querySelectorAll('[data-rating]').forEach(x=>x.classList.remove('selected'));}catch(err){feedbackStatus.textContent=err.message;}});</script></body></html>
