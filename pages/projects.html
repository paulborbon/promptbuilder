<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Projects - Prompt Builder Beta Version</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container-fluid">
  <a class="navbar-brand fw-bold" href="../index.html">Prompt Builder <span class="version-badge">Beta Version</span></a>
  <button class="btn btn-outline-light btn-sm" id="themeToggle">Light / Dark</button>
</div></nav>
<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div><h2 class="mb-1">Saved Projects</h2><div class="text-secondary small">Projects stored in this browser.</div></div>
    <div class="d-flex gap-2">
      <label class="btn btn-outline-secondary mb-0">Import JSON<input id="importJson" type="file" accept=".json,application/json" hidden></label>
      <a class="btn btn-primary" href="builder.html?new=1">New Project</a>
    </div>
  </div>
  <div id="projectList" class="row g-3"></div>
</main>
<script src="../javascript/file-save.js"></script><script src="../javascript/storage.js"></script><script src="../javascript/config.js"></script><script src="../javascript/site-services.js"></script><script src="../javascript/app.js"></script>
<script>
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[ch]));}
function render(){
 const list=PBStorage.getSavedProjects(),root=document.getElementById("projectList");
 if(!list.length){root.innerHTML='<div class="col-12"><div class="alert alert-secondary">No saved projects yet.</div></div>';return;}
 root.innerHTML=list.map(p=>`<div class="col-md-6 col-lg-4"><div class="card h-100 rounded-4"><div class="card-body">
 <h5>${esc(p.projectName||"Untitled Project")}</h5><div class="small text-secondary mb-2">${esc(p.selections?.theme||"")} ${p.selections?.type?"• "+esc(p.selections.type):""}</div>
 <div class="small text-secondary mb-3">Last edited: ${new Date(p.lastEdited||p.createdDate).toLocaleString()}</div>
 <div class="d-flex flex-wrap gap-2"><a class="btn btn-sm btn-primary" href="builder.html?id=${encodeURIComponent(p.id)}">Open</a>
 <button class="btn btn-sm btn-outline-secondary" onclick="downloadProject('${p.id}')">Save JSON As...</button>
 <button class="btn btn-sm btn-outline-danger" onclick="deleteProject('${p.id}')">Delete</button></div></div></div></div>`).join("");
}
function deleteProject(id){if(!confirm("Delete this saved project?"))return;PBStorage.deleteProject(id);render();}
async function downloadProject(id){const p=PBStorage.getProject(id);if(p)await PBStorage.exportJSON(p);}
document.getElementById("importJson").addEventListener("change",async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{const p=JSON.parse(await file.text());const saved=PBStorage.addSavedProject(p);PBStorage.saveDraft(saved);alert("Project imported.");render();}
 catch{alert("That file is not a valid Prompt Builder JSON project.");}
});
render();
</script></body></html>
